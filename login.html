<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · RepairFlow</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/login.css">
<script type="module" src="./js/auth.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 3.5v17h17M6.5 15.5l4.5-5 3.5 2.8 5-7"/><circle cx="19.5" cy="6.3" r="1"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.8 6.2a5.4 5.4 0 0 0-7.1 7.1L3 18l3 3 4.7-4.7a5.4 5.4 0 0 0 7.1-7.1l-4 4-3-3 4-4Z"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.8L16.5 9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8.5 8.5 0 1 0 1 5M20 3v5h-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.4 4.5 2.6 18a1.8 1.8 0 0 0 1.6 2.7h15.6a1.8 1.8 0 0 0 1.6-2.7L13.6 4.5a1.8 1.8 0 0 0-3.2 0Z"/><path d="M12 9v5m0 3h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.6-1 10.7-10.7-3.6-3.6L5 15.4 4 20ZM13.7 6.7l3.6 3.6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 7H4l4-4M4 7h10a7 7 0 1 1-6.1 10.5"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5h6V3H9v2ZM9 12h6m-6 4h6"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6m0-9h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 4h7v7M11 13l9-9M19 14v5H5V5h5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/></symbol>
  </svg>
  <section class="login-screen" id="login-screen" aria-label="Đăng nhập RepairFlow">
    <div class="login-stage">
      <div class="login-stage-glow" aria-hidden="true"></div>

      <div class="login-intro">
        <span class="login-intro-badge">REPAIRFLOW · MAINTENANCE WORKSPACE</span>
        <h1>Theo dõi công việc sửa chữa tạm<br></h1>
        <p>V1.0</p>
      </div>

      <div class="login-center">
        <div class="login-card">
          <div class="login-card-art" aria-hidden="true">
            <span class="login-card-art-light"></span>
            <span class="login-card-art-caption">RepairFlow</span>
          </div>
          <div class="login-brand-bubble">
            <img
              src="./assets/suntory-pepsico.png"
              alt="Suntory PepsiCo"
              width="170"
              height="105"
            >
          </div>

          <div class="login-card-body">
            <span class="login-kicker">ĐĂNG NHẬP HỆ THỐNG</span>

            <form id="login-form" novalidate>
              <label class="login-field" for="login-email">Email</label>
              <div class="login-input-wrap">
                <svg class="icon"><use href="#i-mail"></use></svg>
                <input
                  type="email"
                  id="login-email"
                  name="email"
                  autocomplete="username"
                  placeholder="Email của bạn"
                  required
                >
              </div>

              <label class="login-field" for="login-password">Mật khẩu</label>
              <div class="login-input-wrap">
                <svg class="icon"><use href="#i-lock"></use></svg>
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  autocomplete="current-password"
                  placeholder="Nhập mật khẩu"
                  required
                >
                <button type="button" class="login-eye" id="login-password-visibility" aria-label="Hiện hoặc ẩn mật khẩu" aria-pressed="false">
                  <svg class="icon"><use href="#i-eye"></use></svg>
                </button>
              </div>

              <p class="login-error" id="login-error" role="alert" hidden></p>
              <button type="submit" class="login-submit" id="login-submit">
                <span>Đăng nhập</span>
                <svg class="icon"><use href="#i-arrow"></use></svg>
              </button>
            </form>

          </div>
        </div>
      </div>

      <footer class="login-footer">© 2026 RepairFlow · Made by Nguyễn Phúc Vinh</footer>
    </div>
  </section>
</body>
</html>
